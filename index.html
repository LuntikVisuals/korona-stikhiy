<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1660">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Корона Стихий</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#24124a;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"Trebuchet MS","Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:none;touch-action:none}
.ic{width:1.1em;height:1.1em;vertical-align:-0.2em;display:inline-block}
.tx{text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 3px rgba(0,0,0,.35)}
#menu{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:linear-gradient(180deg,#46a3ff 0%,#6d54e0 42%,#3b1f86 100%);overflow:hidden}
#menu:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.25),transparent 40%),radial-gradient(circle at 85% 60%,rgba(255,120,220,.18),transparent 45%)}
header#top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;gap:6px;background:rgba(20,10,60,.35);border-bottom:2px solid rgba(255,255,255,.15)}
.me{display:flex;align-items:center;gap:8px;min-width:0}
.ava{width:42px;height:42px;border-radius:12px;border:3px solid #ffd54a;background:#2b62c9;overflow:hidden;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.ava img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.me b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.me small{display:block;font-size:12px;color:#ffe9a6}
.klv{display:inline-block;background:#2f8bff;border:2px solid #9fd0ff;border-radius:7px;padding:0 5px;font-weight:bold;font-size:11px;color:#fff;margin-right:4px}
.res{display:flex;gap:6px}
.pill{background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.2);border-radius:20px;padding:3px 9px 3px 6px;font-weight:bold;font-size:14px;white-space:nowrap}
main#pages{position:relative;flex:1;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:12px 12px 20px;display:none;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.page.on{display:block}
nav#tabs{position:relative;display:flex;background:linear-gradient(#2d1a6b,#1d0f4a);border-top:3px solid #5b3fc4;padding-bottom:env(safe-area-inset-bottom)}
nav#tabs button{flex:1;background:none;border:0;color:#b9a9ff;font:inherit;font-size:12px;font-weight:bold;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav#tabs button svg{width:28px;height:28px}
nav#tabs button.on{color:#fff;background:linear-gradient(#5b3fc4,#3d2596)}
.btn{display:inline-block;border:0;border-radius:14px;padding:10px 18px;font:inherit;font-weight:bold;font-size:17px;color:#fff;cursor:pointer;background:linear-gradient(#58d35a,#2e9a32);box-shadow:0 4px 0 #1d6b20,0 6px 10px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.35);position:relative}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1d6b20}
.btn.y{background:linear-gradient(#ffe066,#ffb000);box-shadow:0 5px 0 #b06d00,0 7px 12px rgba(0,0,0,.35);color:#fff}
.btn.b{background:linear-gradient(#5fb2ff,#2a6fe0);box-shadow:0 4px 0 #1a449b,0 6px 10px rgba(0,0,0,.3)}
.btn.r{background:linear-gradient(#ff7a7a,#e0303f);box-shadow:0 4px 0 #8e1622,0 6px 10px rgba(0,0,0,.3)}
.btn.g{background:linear-gradient(#a7a2c4,#6d6890);box-shadow:0 4px 0 #403b5e}
.btn[disabled]{filter:grayscale(.8) brightness(.8);pointer-events:none}
.panel{background:rgba(25,12,70,.55);border:2px solid rgba(255,255,255,.18);border-radius:16px;padding:10px;margin-bottom:12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.h2{font-size:18px;font-weight:bold;margin:2px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.h2 small{font-size:13px;color:#ffe9a6}
/* battle page */
.arena-card{position:relative;border-radius:18px;overflow:hidden;border:3px solid #ffd54a;box-shadow:0 6px 0 rgba(0,0,0,.3);margin-bottom:12px}
.arena-card img{display:block;width:100%;height:190px;object-fit:cover}
.arena-card .an{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:22px;font-weight:bold}
.arena-card .al{position:absolute;left:0;right:0;top:36px;text-align:center;font-size:13px;color:#fff6c9}
.troph{display:flex;justify-content:center;align-items:center;gap:8px;font-size:28px;font-weight:bold;margin:6px 0 4px}
.troph .ic{width:34px;height:34px}
.tbar{height:12px;border-radius:8px;background:rgba(0,0,0,.4);overflow:hidden;margin:0 20px 6px;border:2px solid rgba(255,255,255,.2)}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf3a,#ff8a00)}
.tnext{text-align:center;font-size:12px;color:#ffe9a6;margin-bottom:12px}
#playBtn{display:block;width:78%;margin:0 auto 16px;font-size:30px;padding:14px 0;letter-spacing:1px}
.chests{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.slot{background:rgba(0,0,0,.3);border:2px dashed rgba(255,255,255,.25);border-radius:12px;height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;color:#d6ccff;cursor:pointer;position:relative;padding:2px}
.slot.full{border-style:solid;background:linear-gradient(#5a3fc9,#33208a)}
.slot.ready{background:linear-gradient(#5bd85f,#2c8f30);animation:pulse 1s infinite}
.slot.unl{background:linear-gradient(#ffb34d,#d7700e)}
.slot img{width:62px;height:52px;object-fit:contain}
.slot b{font-size:11px}
@keyframes pulse{50%{transform:scale(1.05)}}
/* cards */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid.pg{row-gap:26px;padding-bottom:16px}
.card{position:relative;border-radius:10px;border:3px solid #8fb3d9;background:#1d1446;overflow:visible;cursor:pointer;aspect-ratio:4/5.2;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.card img{display:block;width:100%;height:100%;border-radius:7px;object-fit:cover}
.card.r-r{border-color:#ffa63d}.card.r-e{border-color:#c46bff}.card.r-l{border-color:#3ff0d0;box-shadow:0 0 8px #3ff0d0,0 3px 0 rgba(0,0,0,.35)}
.card .cost{position:absolute;left:-6px;top:-7px;width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:radial-gradient(circle at 35% 35%,#ff9bf0,#c21fb0 70%);border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.card .cost span{transform:rotate(45deg);font-weight:bold;font-size:13px;text-shadow:0 1px 0 #000}
.card .lvl{position:absolute;left:50%;transform:translateX(-50%);bottom:18%;white-space:nowrap;background:rgba(10,5,40,.72);border-radius:7px;padding:0 6px;font-size:11px;font-weight:bold;line-height:15px}
.card .prog{position:absolute;left:1px;right:1px;bottom:-18px;height:12px;border-radius:6px;background:rgba(0,0,0,.6);overflow:hidden;font-size:9px;line-height:12px;text-align:center;font-weight:bold}
.card .prog i{position:absolute;left:0;top:0;bottom:0;background:#3ea0ff}
.card .prog.up i{background:#3ed65a}
.card .prog span{position:relative}
.card.locked{filter:grayscale(1) brightness(.55)}
.card.locked .lk{position:absolute;inset:auto 0 30% 0;text-align:center;font-size:10px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000;filter:none}
.card .upa{position:absolute;right:-5px;top:-7px;width:20px;height:20px;border-radius:50%;background:#3ed65a;border:2px solid #fff;font-weight:bold;font-size:13px;line-height:16px;text-align:center;animation:pulse 1s infinite}
.card .newb{position:absolute;right:-6px;top:-8px;background:#ff3b6b;border:2px solid #fff;border-radius:8px;font-size:9px;padding:1px 4px;font-weight:bold}
.wig{animation:wig .35s infinite}
@keyframes wig{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.deckinfo{display:flex;justify-content:space-between;font-size:13px;color:#ffe9a6;margin-top:8px}
/* road */
.ar{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;margin-bottom:10px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.15)}
.ar.cur{border-color:#ffd54a;background:rgba(255,213,74,.15)}
.ar.lock{opacity:.6}
.ar img.aimg{width:92px;height:62px;border-radius:10px;object-fit:cover;flex:none;border:2px solid rgba(255,255,255,.35)}
.ar .ai{flex:1;min-width:0}
.ar .ai b{display:block;font-size:15px}
.ar .ai small{display:block;font-size:12px;color:#ffe9a6}
.ar .cc{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.ar .cc img{width:26px;height:33px;border-radius:4px;border:1px solid rgba(255,255,255,.5)}
/* profile */
.prof{display:flex;flex-direction:column;align-items:center;gap:8px}
.prof .ava{width:92px;height:92px;border-radius:22px;border-width:4px}
.nick{display:flex;gap:6px;width:100%}
.nick input{flex:1;min-width:0;font:inherit;font-size:17px;font-weight:bold;padding:8px 12px;border-radius:12px;border:3px solid #6d54e0;background:#fff;color:#2a1660;outline:none;user-select:text;-webkit-user-select:text}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%}
.stats div{background:rgba(0,0,0,.28);border-radius:10px;padding:7px 9px;font-size:12px;color:#d6ccff}
.stats div b{display:block;font-size:18px;color:#fff}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%}
.avs img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 30%;border-radius:10px;border:3px solid transparent;background:#2b62c9;cursor:pointer}
.avs img.on{border-color:#ffd54a}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.xpbar{width:100%;height:14px;border-radius:8px;background:rgba(0,0,0,.4);overflow:hidden;border:2px solid rgba(255,255,255,.2);position:relative}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#5fb2ff,#2a6fe0)}
.xpbar span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:11px;font-weight:bold}
/* overlays */
#ov{position:fixed;inset:0;display:none;z-index:20;align-items:center;justify-content:center;background:rgba(10,4,30,.72);padding:16px}
#ov.on{display:flex}
.modal{width:100%;max-width:400px;max-height:94%;overflow-y:auto;background:linear-gradient(#5a46d6,#2e1b7c);border:3px solid #a99bff;border-radius:20px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);position:relative;touch-action:pan-y;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.modal .x{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:10px;border:0;background:#e0303f;color:#fff;font-weight:bold;font-size:18px;box-shadow:0 3px 0 #8e1622;cursor:pointer}
.ci{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.ci .card{width:96px;flex:none;cursor:default}
.ci h3{font-size:19px;margin-bottom:2px;padding-right:30px}
.ci .rar{font-size:13px;font-weight:bold}
.ci p{font-size:13px;color:#e6defd;margin-top:5px;line-height:1.3}
.st{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:12px}
.st div{background:rgba(0,0,0,.28);border-radius:9px;padding:5px 8px;font-size:11px;color:#cfc4ff}
.st div b{display:block;font-size:15px;color:#fff}
.st div em{font-style:normal;color:#5dff7a;font-size:12px}
.mb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:40;background:rgba(20,8,60,.92);border:2px solid #ffd54a;padding:9px 16px;border-radius:14px;font-weight:bold;font-size:15px;display:none;text-align:center;max-width:90%;pointer-events:none}
.res-t{font-size:40px;font-weight:bold;text-align:center;letter-spacing:1px;margin:4px 0 8px}
.res-t.win{color:#ffd54a}.res-t.lose{color:#ff8f8f}.res-t.draw{color:#cfd8ff}
.crowns{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.crowns svg{width:52px;height:52px}
.vs{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:10px;background:rgba(0,0,0,.25);border-radius:12px;padding:8px 10px}
.vs b{font-size:22px}
.rw{display:flex;justify-content:center;gap:16px;font-size:20px;font-weight:bold;margin:8px 0 12px;flex-wrap:wrap}
.chestbox{text-align:center;margin-bottom:12px}
.chestbox img{width:120px;height:100px;object-fit:contain}
.copen{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:330px;justify-content:center}
.copen img.big{width:180px;height:150px;object-fit:contain;cursor:pointer}
.shake{animation:shk .5s infinite}
@keyframes shk{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) scale(1.03)}75%{transform:rotate(6deg) scale(1.03)}}
.rew{animation:rewin .35s ease-out}
@keyframes rewin{from{transform:translateY(40px) scale(.4);opacity:0}to{transform:none;opacity:1}}
.rew .card{width:120px;margin:0 auto;cursor:default}
.rewl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.rewl .card{cursor:default}
.rewl .cnt,.rew .cnt{position:absolute;right:3px;top:3px;background:rgba(10,5,40,.8);border-radius:8px;padding:0 5px;font-weight:bold;font-size:13px;line-height:18px}
.hint{font-size:12px;color:#d6ccff;text-align:center}
.small{font-size:12px;color:#d6ccff}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="menu">
  <header id="top">
    <div class="me" id="meBox"><div class="ava" id="topAva"></div><div><b id="topName" class="tx"></b><small id="topSub"></small></div></div>
    <div class="res"><span class="pill tx" id="topGold"></span><span class="pill tx" id="topGems"></span></div>
  </header>
  <main id="pages">
    <section class="page" id="pg-deck"></section>
    <section class="page" id="pg-battle"></section>
    <section class="page" id="pg-road"></section>
    <section class="page" id="pg-profile"></section>
  </main>
  <nav id="tabs"></nav>
</div>
<div id="ov"></div>
<div id="toast"></div>
<script>
(function(){
'use strict';
// ================= UTIL =================
const TAU=Math.PI*2;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(0.01,r),0,TAU);}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,Math.max(0.01,rx),Math.max(0.01,ry),0,0,TAU);}
function fs(c,f,s){if(f){c.fillStyle=f;c.fill();}if(s!==false)c.stroke();}
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function fmtT(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

// ================= DATA =================
const TITLE='Корона Стихий';
const RAR={
  c:{n:'Обычная',col:'#8fb3d9',dark:'#3d5a80',bg:['#8fd3ff','#3a6fd0'],up:[2,4,8,14,22,34,50,70,100],g:1},
  r:{n:'Редкая',col:'#ffa63d',dark:'#a35a00',bg:['#ffd98a','#e0751c'],up:[1,2,4,6,10,15,22,30,40],g:1.4},
  e:{n:'Эпическая',col:'#c46bff',dark:'#5e1f99',bg:['#e6b0ff','#7a33d0'],up:[1,1,2,3,5,7,10,13,16],g:2},
  l:{n:'Легендарная',col:'#3ff0d0',dark:'#0b7f73',bg:['#b5fff2','#2b8fd8'],up:[1,1,1,2,2,3,4,5,6],g:3}
};
const GOLD_UP=[10,25,60,120,250,450,750,1200,2000];
const KXP=[0,40,120,250,450,750,1150,1700,2400,3300];
const MAXL=10;
const CARDS=[
 {id:'knight',name:'Латник Зорян',rar:'c',type:'troop',cost:3,arena:0,look:'knight',hp:720,dmg:85,hs:1.2,range:0.6,speed:1.0,targets:'ground',count:1,r:0.45,mass:6,desc:'Крепкий рыцарь в зеркальных латах. Надёжно держит удар и защищает башни.'},
 {id:'archers',name:'Искорки-лучницы',rar:'c',type:'troop',cost:3,arena:0,look:'archer',hp:130,dmg:45,hs:1.0,range:5,speed:1.0,targets:'both',count:2,r:0.35,mass:2,proj:'arrow',desc:'Две сестры-лучницы. Стреляют и по наземным, и по летающим целям.'},
 {id:'goblins',name:'Гоблы-шустрики',rar:'c',type:'troop',cost:2,arena:0,look:'goblin',hp:85,dmg:52,hs:1.1,range:0.5,speed:1.5,targets:'ground',count:3,r:0.32,mass:1.5,desc:'Трое быстрых гоблов с кинжалами. Налетают и режут всё подряд.'},
 {id:'bones',name:'Костеплясы',rar:'c',type:'troop',cost:1,arena:0,look:'bones',hp:34,dmg:34,hs:1.0,range:0.5,speed:1.5,targets:'ground',count:4,r:0.28,mass:1,desc:'Четыре пляшущих скелетика. Дёшево, быстро и очень назойливо.'},
 {id:'moths',name:'Жар-мотыльки',rar:'c',type:'troop',cost:3,arena:0,look:'moth',air:true,hp:95,dmg:40,hs:1.0,range:1.6,speed:1.6,targets:'both',count:3,r:0.32,mass:1.5,proj:'spark',desc:'Огненные мотыльки перелетают реку и жалят искрами.'},
 {id:'cannon',name:'Пушка-Ромашка',rar:'c',type:'building',cost:3,arena:0,look:'cannon',hp:760,dmg:95,hs:0.9,range:5.5,targets:'ground',r:0.9,life:30,proj:'ball',desc:'Цветочная пушка. Отвлекает великанов и бьёт наземных врагов.'},
 {id:'arrows',name:'Стрелопад',rar:'c',type:'spell',cost:3,arena:0,look:'arrows',dmg:210,radius:3.8,desc:'Три волны стрел накрывают большую область. Лучшее средство от роя.'},
 {id:'fireball',name:'Огнешар',rar:'r',type:'spell',cost:4,arena:0,look:'fireball',dmg:380,radius:2.5,desc:'Огненный шар: сильный урон по области и отбрасывание лёгких врагов.'},

  }else if(type==='staff'){
    c.translate(0.3*s,-0.1*s);c.rotate(0.12-a*0.35);
    c.lineWidth=Math.max(1.5,s*0.07);c.strokeStyle='#6b3f1d';c.beginPath();c.moveTo(0,0);c.lineTo(0,-0.95*s);c.stroke();

function humanoid(c,x,y,s,team,an,o){

  c.save();c.translate(x,y);c.scale(an.face||1,1);

  if(o.robe){c.beginPath();c.moveTo(-0.17*s,-0.74*s);c.lineTo(0.17*s,-0.74*s);c.lineTo(0.31*s,-0.1*s);c.quadraticCurveTo(0,-0.03*s,-0.31*s,-0.1*s);c.closePath();fs(c,o.body);}
  else if(o.ribs){ell(c,0,-0.42*s,0.2*s,0.27*s);fs(c,'#f4f1e6');c.beginPath();for(let i=0;i<3;i++){c.moveTo(-0.13*s,-0.5*s+i*0.09*s);c.lineTo(0.13*s,-0.5*s+i*0.09*s);}c.stroke();}
  else{ell(c,0,-0.42*s,0.26*s,0.31*s);fs(c,o.body);}
  if(!o.ribs){c.fillStyle=tc.m;rr(c,-0.23*s,-0.4*s,0.46*s,0.1*s,0.03*s);fs(c,tc.m);}

function loadSave(){
  let s=null;try{s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');}catch(e){s=null;}
  const d=defaultSave();

  for(const k in d)if(s[k]===undefined)s[k]=d[k];
  for(const k in d.stats)if(s.stats[k]===undefined)s.stats[k]=0;
  for(const id in s.cards)if(!CARD[id]||!CARDS.includes(CARD[id]))delete s.cards[id];

function genChest(type){
  const ch=CHESTS[type],ai=arenaIdx(save.trophies);
  const pool=r=>CARDS.filter(c=>c.rar===r&&c.arena<=ai);
  const total=Math.round(ch.cards*(1+ai*0.35));
  const out={};const add=(id,n)=>{if(n>0)out[id]=(out[id]||0)+n;};
  let left=total;
  const give=(r,n)=>{const chain={l:['l','e','r','c'],e:['e','r','c'],r:['r','c'],c:['c']}[r];for(const rr2 of chain){const p=pool(rr2);if(p.length){const k=Math.min(n,left);add(pick(p).id,Math.max(1,Math.round(k*(rr2===r?1:rr2==='e'?2:rr2==='r'?3:6))));left-=k;return;}}};
  const gu=ch.gu;if(gu.l)give('l',gu.l);if(gu.e)give('e',gu.e);if(gu.r){const a=Math.ceil(gu.r/2);give('r',a);if(gu.r-a>0)give('r',gu.r-a);}
  if(type!=='wood'&&Math.random()<0.06)give('e',1);
  if(type!=='wood'&&Math.random()<0.012)give('l',1);
  if(Math.random()<0.25)give('r',1);
  const stacks=Math.min(3,Math.max(1,Math.ceil(left/6)));
  for(let i=0;i<stacks&&left>0;i++){const n=i===stacks-1?left:Math.ceil(left/(stacks-i));const p=pool('c');add(pick(p).id,n);left-=n;}
  const gold=rint(ch.gold[0],ch.gold[1])*(1+ai*0.3)|0;
  const gems=type==='wood'?0:Math.random()<0.4?rint(1,type==='legend'?15:5):0;
  return{cards:Object.entries(out).map(([id,n])=>({id,n})).sort((a,b)=>'clre'.indexOf(CARD[a.id].rar)-'clre'.indexOf(CARD[b.id].rar)),gold,gems};
}

function arenaArt(i,w,h){
  const key='a'+i+'_'+w;if(arenaArt[key])return arenaArt[key];
  const cv2=document.createElement('canvas');cv2.width=w;cv2.height=h;const c=cv2.getContext('2d');const A=ARENAS[i];const R=seeded(5+i*31);
  let g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,A.sky[0]);g.addColorStop(1,A.sky[1]);c.fillStyle=g;c.fillRect(0,0,w,h);
  c.fillStyle='rgba(255,255,255,.5)';for(let k=0;k<4;k++){const x=R()*w,y=R()*h*0.35;circ(c,x,y,h*0.06);c.fill();circ(c,x+h*0.06,y+3,h*0.05);c.fill();}
  c.fillStyle=A.edge;c.beginPath();c.moveTo(0,h*0.62);for(let x=0;x<=w;x+=w/8)c.lineTo(x,h*0.55+Math.sin(x*0.03+i)*h*0.06);c.lineTo(w,h);c.lineTo(0,h);c.fill();
  c.fillStyle=A.g[0];c.beginPath();c.moveTo(0,h*0.75);c.quadraticCurveTo(w/2,h*0.62,w,h*0.75);c.lineTo(w,h);c.lineTo(0,h);c.fill();
  c.fillStyle=A.river;c.beginPath();c.moveTo(0,h*0.9);c.quadraticCurveTo(w/2,h*0.84,w,h*0.9);c.lineTo(w,h*0.96);c.quadraticCurveTo(w/2,h*0.9,0,h*0.96);c.fill();
  for(let k=0;k<10;k++)decoTree(c,R()*w,h*0.62+R()*h*0.2,h*0.08,A,R);
  const s=h*0.12;drawTower(c,w*0.18,h*0.83,s*0.8,0,false,{an:{t:1}});drawTower(c,w*0.82,h*0.83,s*0.8,1,false,{an:{t:2}});drawTower(c,w*0.5,h*0.8,s,0,true,{an:{t:0}});
  return arenaArt[key]=cv2.toDataURL();
}

function statsRows(id,l,nextL){
  const c=CARD[id];const rows=[];const f=(v,lab,unit)=>{const a=lv(v,l);rows.push([lab,a+(unit||''),nextL?'+'+(lv(v,nextL)-a):'']);};
  const tg={ground:'Наземные',both:'Земля и воздух',buildings:'Только здания',air:'Воздух'};
  const spd=s=>s>=1.5?'Очень быстро':s>=1.2?'Быстро':s>=0.9?'Средне':'Медленно';
  if(c.hp)f(c.hp,c.type==='building'?'Прочность':'Здоровье');
  if(c.dmg)f(c.dmg,c.type==='spell'?'Урон (башням 30%)':c.splash?'Урон по площади':'Урон');
  if(c.heal)f(c.heal,'Лечение в секунду');
  if(c.hs&&c.dmg)rows.push(['Скорость атаки',c.hs+' с','']);
  if(c.type==='troop')rows.push(['Скорость',spd(c.speed),'']);
  if(c.range&&c.type!=='spell')rows.push(['Дальность',c.range<1.5?'Ближний бой':c.range,'']);
  if(c.targets&&c.type!=='spell')rows.push(['Цели',tg[c.targets],'']);
  if((c.count||1)>1)rows.push(['Количество','×'+c.count,'']);
  if(c.radius)rows.push(['Радиус',c.radius,'']);
  if(c.dur)rows.push(['Длительность',c.dur+' с','']);
  if(c.life)rows.push(['Время жизни',c.life+' с','']);
  if(c.air)rows.push(['Тип','Летающий','']);
  if(c.spawn)rows.push(['Призывает',CARD[c.spawn.id].name+' ×'+c.spawn.n+' / '+c.spawn.every+' с','']);
  if(c.death)rows.push(['После гибели',CARD[c.death.id].name+' ×'+c.death.n,'']);
  return rows.map(r=>`<div>${r[0]}<b>${r[1]} ${r[2]?`<em>${r[2]}</em>`:''}</b></div>`).join('');
}

  modal(`<h3 style="text-align:center;margin-bottom:12px">Пауза</h3><div class="mb" style="flex-direction:column;align-items:stretch"><button class="btn" id="pzC">Продолжить</button><button class="btn r" id="pzS">Сдаться</button></div>`,true);
  $('#pzC').onclick=()=>{B.paused=false;closeModal();};
  $('#pzS').onclick=()=>{closeModal();B.paused=false;B.side[1].crowns=Math.max(B.side[1].crowns,B.side[0].crowns+1);finish(false);B.endT=0.8;};
}
function showResult(){
  const w=B.winner,S0=B.side[0],S1=B.side[1];const ai0=arenaIdx(save.trophies);
  let dT=0,gold=0,chestType=null,gems=0;
  save.stats.games++;
  if(w===0){dT=rint(27,33);gold=20+ai0*12+S0.crowns*5;save.stats.wins++;if(S0.crowns>=3)save.stats.three++;gems=Math.random()<0.3?rint(1,3):0;
    const slot=save.chests.findIndex(s=>!s);if(slot>=0){chestType=CHEST_CYCLE[save.cycle%CHEST_CYCLE.length];save.cycle++;save.chests[slot]={type:chestType,state:'locked',end:0};}
    addXP(12);}
  else if(w===1){dT=-rint(18,22);const floor=ARENAS[ai0].t;if(save.trophies+dT<floor)dT=floor-save.trophies;save.stats.losses++;gold=5;addXP(3);}
  else{save.stats.draws++;gold=10;addXP(5);}
  save.trophies=Math.max(0,save.trophies+dT);save.maxTrophies=Math.max(save.maxTrophies,save.trophies);save.gold+=gold;save.gems+=gems;
  const ai1=arenaIdx(save.trophies);
  persist();
  const crown=(n,col)=>[0,1,2].map(i=>`<span style="color:${i<n?col:'rgba(255,255,255,.18)'}">${SVG.crown}</span>`).join('');
  modal(`<div class="res-t tx ${w===0?'win':w===1?'lose':'draw'}">${w===0?'ПОБЕДА!':w===1?'ПОРАЖЕНИЕ':'НИЧЬЯ'}</div>
    <div class="crowns">${crown(S0.crowns,'#ffd23f')}</div>
    <div class="vs"><div><div style="color:#9fd0ff;font-weight:bold">${esc(save.name)}</div><b style="color:#5fb2ff">${S0.crowns}</b></div><div class="small">против</div><div style="text-align:right"><div style="color:#ffa3ac;font-weight:bold">${esc(S1.name)}</div><b style="color:#ff6b7a">${S1.crowns}</b></div></div>
    <div class="rw tx"><span>${SVG.trophy} ${dT>=0?'+':''}${dT}</span><span>${SVG.coin} +${gold}</span>${gems?`<span>${SVG.gem} +${gems}</span>`:''}</div>
    ${chestType?`<div class="chestbox"><img src="${CHESTIMG[chestType].url}"><div><b>${CHESTS[chestType].n}</b></div><div class="hint">${CHESTS[chestType].time?'Открывается '+fmtT(CHESTS[chestType].time):'Открывается сразу'}</div></div>`:w===0?'<p class="hint" style="margin-bottom:10px">Все места для сундуков заняты — открой сундуки, чтобы получать новые.</p>':''}
    ${ai1>ai0?`<p style="text-align:center;color:#ffd54a;font-weight:bold;margin-bottom:10px">Новая арена: «${ARENAS[ai1].n}»! Новые карты в сундуках.</p>`:''}
    <div class="mb"><button class="btn" id="resOk">В меню</button></div>`,true);
  $('#resOk').onclick=()=>{toMenu();showPage('battle');};
}
// ================= MAIN LOOP =================
let lastT=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.1,Math.max(0,(now-lastT)/1000));lastT=now;
  if(mode==='battle'&&B){
    if(!B.paused){acc+=dt*(B.speed||1);let it=0;while(acc>=STEP&&it<60){step(STEP);acc-=STEP;it++;}if(it>=60)acc=0;}
    if(B)render(dt);
  }
}
// ================= INIT =================
function init(){
  CARDS.forEach(c=>makeIcon(c.id));makeIcon('pebble');makeChestImgs();
  save=loadSave();persist();
  layout();renderAll();showPage('battle');
  setInterval(chestTick,500);
  requestAnimationFrame(frame);
  window.addEventListener('resize',()=>{layout();});
  document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1){e.preventDefault();return;}if(!e.target.closest||!e.target.closest('.page,.modal'))e.preventDefault();},{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
  document.addEventListener('contextmenu',e=>{if(!e.target.closest('input'))e.preventDefault();});
  document.addEventListener('pointerdown',()=>audioInit(),{once:false,passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='battle'&&B&&!B.over&&!B.paused)showPause();});
  // Android back button hook: returns true if handled inside the game
  window.__gameBack=function(){
    const ov=$('#ov');
    if(mode==='battle'&&B){if(B.over)return true;if(B.paused){B.paused=false;closeModal();}else showPause();return true;}
    if(ov.classList.contains('on')){if(!$('#mx')&&!$('#coOk'))return true;closeModal();renderAll();return true;}
    if(swapId){swapId=null;renderDeckPage();return true;}
    if(page!=='battle'){showPage('battle');return true;}
    return false;
  };
  // test/debug hooks
  window.__game={get save(){return save;},get B(){return B;},get mode(){return mode;},CARDS,
    sim(sec){if(!B)return;const n=Math.round(sec/STEP);for(let i=0;i<n&&B;i++){if(B.resultShown)break;step(STEP);}},
    deploy:(i,x,y)=>B&&deploy(0,i,x,y),botDeploy:(i,x,y)=>B&&deploy(1,i,x,y),setSpeed:s=>{if(B)B.speed=s;},startBattle,toMenu,showPage,
    w2s:(x,y)=>w2s(x,y),handRect:i=>LAY.cards[i]};
}
init();
})();
</script>
